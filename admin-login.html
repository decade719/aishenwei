<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10243c">
<title>管理登录 | 深维智能科技（镇江）有限公司</title>
<link rel="icon" href="images/shenwei-logo-mark-96.png" type="image/png">
<link rel="stylesheet" href="company.css?v=20261027-light1">
<link rel="stylesheet" href="admin.css?v=20261027-admin5">
<script src="admin.js?v=20261027-admin5" defer></script>
</head>
<body class="admin-page">
<main class="admin-login-shell">
<a class="admin-back" href="index.html">← 返回公司网站</a>
<section class="admin-login-card" aria-labelledby="adminLoginTitle">
<div class="admin-brand">
<img src="images/shenwei-logo-mark.webp" width="72" height="72" alt="">
<div><strong>深维智能科技（镇江）有限公司</strong><span>业务咨询管理</span></div>
</div>
<div class="admin-login-copy">
<span class="admin-eyebrow">ADMIN PORTAL</span>
<h1 id="adminLoginTitle">管理员登录</h1>
<p>登录后可查看网站提交的咨询，并删除不再需要的记录。</p>
</div>
<form id="adminLoginForm" class="admin-login-form">
<label for="adminPassword">管理员密码</label>
<div class="password-field">
<input id="adminPassword" name="admin_access_code" type="password" autocomplete="current-password" aria-describedby="passwordPrivacyNote" required>
</div>
<button class="admin-primary" type="submit">登录管理后台</button>
<p id="adminLoginResult" class="admin-result" role="status" aria-live="polite"></p>
</form>
<p id="passwordPrivacyNote" class="admin-security-note">密码只在本次浏览器会话中临时使用，关闭窗口后需要重新登录。</p>
</section>
</main>
</body>
</html>
