<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10243c">
<title>咨询管理 | 深维智能科技（镇江）有限公司</title>
<link rel="icon" href="images/shenwei-logo-mark-96.png" type="image/png">
<link rel="stylesheet" href="company.css?v=20261027-admin1">
<link rel="stylesheet" href="admin.css?v=20261027-admin5">
<script src="admin.js?v=20261027-admin5" defer></script>
</head>
<body class="admin-page admin-dashboard-page">
<header class="admin-topbar">
<a class="admin-topbar-brand" href="index.html">
<img src="images/shenwei-logo-mark.webp" width="46" height="46" alt="">
<span><strong>深维智能科技</strong><small>咨询管理后台</small></span>
</a>
<button id="adminLogout" class="admin-ghost" type="button">退出登录</button>
</header>
<main class="admin-main">
<section class="admin-heading">
<div><span class="admin-eyebrow">INQUIRIES</span><h1>客户咨询</h1><p>网站联系表单提交的业务需求记录。</p></div>
<div class="admin-actions">
<label class="admin-search"><span class="sr-only">搜索咨询</span><input id="inquirySearch" type="search" placeholder="搜索姓名、公司或内容"></label>
<button id="refreshInquiries" class="admin-secondary" type="button">刷新</button>
</div>
</section>
<section class="admin-summary" aria-label="咨询概览">
<article><span>全部记录</span><strong id="inquiryCount">—</strong></article>
<article><span>今日提交</span><strong id="todayCount">—</strong></article>
<article><span>最近更新</span><strong id="lastUpdated">—</strong></article>
</section>
<p id="dashboardResult" class="admin-result" role="status" aria-live="polite"></p>
<section id="inquiryList" class="inquiry-list" aria-busy="true">
<div class="admin-empty"><strong>正在读取咨询记录…</strong><span>请稍候</span></div>
</section>
</main>
<dialog id="deleteDialog" class="admin-dialog">
<form method="dialog">
<h2>删除这条咨询？</h2>
<p>删除后无法恢复，请确认这条记录已经不再需要。</p>
<div><button value="cancel" class="admin-ghost">取消</button><button id="confirmDelete" value="confirm" class="admin-danger">确认删除</button></div>
</form>
</dialog>
<template id="inquiryTemplate">
<article class="inquiry-card">
<header><div><strong data-field="name"></strong><span data-field="company"></span></div><time data-field="createdAt"></time></header>
<dl>
<div><dt>邮箱</dt><dd><a data-field="email"></a></dd></div>
<div><dt>电话</dt><dd data-field="phone"></dd></div>
</dl>
<div class="inquiry-message"><span>需求说明</span><p data-field="message"></p></div>
<footer><span class="inquiry-id" data-field="id"></span><button class="admin-delete" type="button">删除记录</button></footer>
</article>
</template>
</body>
</html>
