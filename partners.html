  <link rel="stylesheet" href="styles.css" />

  <style>
    /* 全屏滚动样式 */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }

    #fullpage-wrapper {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    .fp-section {
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fp-section .container {
      width: 100%;
      max-width: 1400px;
      padding: 60px 20px;
    }

    /* 导航点样式 */
    .fp-nav {
      position: fixed;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 9999;
    }

    .fp-nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .fp-nav li {
      position: relative;
    }

    .fp-nav a {
      display: block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      border: 2px solid rgba(102,126,234,0.8);
      transition: all 0.3s;
      cursor: pointer;
    }

    .fp-nav a:hover,
    .fp-nav a.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transform: scale(1.4);
      box-shadow: 0 0 20px rgba(102,126,234,0.6);
    }

    .fp-nav .fp-tooltip {
      position: absolute;
      right: 32px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
    }

    .fp-nav li:hover .fp-tooltip {
      opacity: 1;
      transform: translateY(-50%) translateX(-8px);
    }

    @media (max-width: 768px) {
      .fp-nav {
        right: 15px;
      }

      .fp-nav a {
        width: 10px;
        height: 10px;
      }

      .fp-section .container {
        padding: 40px 15px;
      }
    }
  </style>
